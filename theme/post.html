
{% extends 'base.html' %}
{% block content %}
<article class='prose dark:prose-invert max-w-prose'>
  <h1>{{ page.meta.title }}</h1>
  <p class='text-sm text-gray-500 dark:text-gray-400'>{{ page.meta.date }}</p>
  {{ page.html | safe }}
  {% if page.meta.tags %}
  <p class='mt-8'>
    {% for t in page.meta.tags %}<a class='mr-2 text-blue-600 dark:text-blue-400' href='/blog/tags/{{ t }}.html'>#{{ t }}</a>{% endfor %}
  </p>
  {% endif %}
</article>
<!-- Floating TOC -->
<nav id='toc' class='hidden xl:block fixed right-8 top-32 w-60 border-l border-gray-200 dark:border-gray-700 pl-4 text-sm space-y-1'></nav>
<script>
  document.addEventListener('DOMContentLoaded',()=>{
    const article=document.querySelector('article');
    const toc=document.getElementById('toc');
    if(!article||!toc) return;

    // Grab headings (h2 & h3) and build TOC entries
    const hs=[...article.querySelectorAll('h2,h3')];

    // Add page title to the top of the TOC
    const pageTitle=document.querySelector('h1');
    if(pageTitle){
      const titleEl=document.createElement('p');
      titleEl.textContent=pageTitle.textContent;
      titleEl.className='block pb-2 font-semibold text-gray-900 dark:text-gray-100';
      toc.appendChild(titleEl);
    }

    // Generate links for each heading
    hs.forEach(h=>{
      // Ensure each heading has an id
      const id=h.id || h.textContent.trim().toLowerCase().replace(/\s+/g,'-');
      h.id=id;
      const a=document.createElement('a');
      a.href='#'+id;
      a.textContent=h.textContent;
      a.className='block py-1 text-gray-600 dark:text-gray-400 hover:text-blue-600';
      toc.appendChild(a);
    });

    const links=[...toc.querySelectorAll('a')];

    // Scroll‑spy: highlight the heading 
    const highlightCurrent=()=>{
      let curIndex=0;
      let minDelta=Infinity;
      hs.forEach((h,i)=>{
        const delta=Math.abs(h.getBoundingClientRect().top - 40);
        if(delta<minDelta){
          minDelta=delta;
          curIndex=i;
        }
      });
      links.forEach((l,i)=>{
        const active=i===curIndex;
        l.classList.toggle('text-blue-600',active);
        l.classList.toggle('font-bold',active);
      });
    };

    /* ---------- RESPONSIVE TOC VISIBILITY ---------- */
    const XL_MIN = 1280;                               // Tailwind's `xl` starts at 1280 px
    const toggleToc = () => {
      if (window.innerWidth >= XL_MIN) {
        toc.classList.remove('hidden');                // show on desktop
        highlightCurrent();                            // ensure initial highlight
      } else {
        toc.classList.add('hidden');                   // hide on tablets / phones
      }
    };

    toggleToc();                                       // run once at load
    window.addEventListener('resize', toggleToc, { passive: true });
    window.addEventListener('scroll',highlightCurrent,{passive:true});

  });
</script>
{% endblock %}
