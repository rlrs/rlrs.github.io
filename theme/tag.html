{% extends 'base.html' %}
{% block content %}
<div class='archive'>
  <h1 class='page-title'>Tagged <span class='tag'>#{{ tag }}</span></h1>
  <ul class='list'>
    {% for p in tag_pages %}
    <li>
      <a href='{{ p.url }}' class='row'>
        <span class='title'>{{ p.meta.title }}</span>
        <time datetime='{{ p.date }}'>{{ p.date.strftime('%-d %b %Y') }}</time>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
