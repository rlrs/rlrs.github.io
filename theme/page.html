{% extends 'base.html' %}
{% block content %}
<article class='page{{ " wide" if page.meta.wide }}'>
  <header class='page-header'>
    {% if page.parent %}
    <a href='{{ page.parent.url }}' class='back'>← Companion to <b>{{ page.parent.meta.title }}</b></a>
    {% endif %}
    <h1 class='page-title'>{{ page.meta.title }}</h1>
    {% if page.meta.summary %}<p class='summary'>{{ page.meta.summary }}</p>{% endif %}
  </header>
  <div class='prose'>
    {{ page.html | safe }}
  </div>
</article>
{% endblock %}
