{% extends 'base.html' %}
{% block content %}
<article>
  <header class='pt-6 pb-8'>
    {% if page.parent %}
    <a href='{{ page.parent.url }}' class='group block text-sm text-muted hover:text-accent transition-colors'>
      <span aria-hidden='true' class='inline-block group-hover:-translate-x-0.5 transition-transform'>←</span>
      Companion to <span class='font-medium text-ink-soft group-hover:text-accent'>{{ page.parent.meta.title }}</span>
    </a>
    {% endif %}
    <h1 class='mt-3 font-serif text-[2rem] sm:text-[2.6rem] leading-[1.15] font-semibold tracking-tight text-ink text-balance'>{{ page.meta.title }}</h1>
    {% if page.meta.summary %}<p class='mt-3 text-lg leading-relaxed text-muted text-pretty'>{{ page.meta.summary }}</p>{% endif %}
  </header>
  <div class='prose max-w-none'>
    {{ page.html | safe }}
  </div>
</article>
{% endblock %}
