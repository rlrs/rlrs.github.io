base_url: https://rlrs.dk
author: Rasmus Larsen
site_name: Rasmus Larsen
description: Writing on ML research and engineering, mostly RL and infrastructure.
language: en

# header: the line under your name (Markdown) and a clock showing your local time
tagline: ML research engineer at [Danish Foundation Models](https://www.foundationmodels.dk)
clock:
  city: Copenhagen
  timezone: Europe/Copenhagen

# home page: a dithered live view of the sky over the Øresund, and a lit 3D figure next to each post
# (static/sky.js). Leave out to turn both off.
sky:
  slider: false   # true adds a time-of-day slider under the view

# home page, right column
projects:
  - title: sandboxes
    url: https://github.com/rlrs/sandboxes
    description: Self-hosted sandboxes for agents, evals and RL rollouts
  - title: maester
    url: https://github.com/rlrs/maester
    description: Language model training framework in modern PyTorch

elsewhere:
  - title: GitHub
    url: https://github.com/rlrs
    note: rlrs
    icon: github          # theme/icons/<icon>.svg
  - title: X
    url: https://x.com/synquid
    note: "@synquid"
    icon: x
  - title: Hugging Face
    url: https://huggingface.co/synquid
    note: synquid
    icon: huggingface

# home page, top of the Writing list: posts that aren't published yet (no page, no RSS)
