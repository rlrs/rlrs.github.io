<svg viewBox="0 0 760 232" role="img" aria-label="Model waits end long before hibernation could pay off" font-size="12"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)"><tspan x="24" y="28">Model waits end long before hibernation could pay off</tspan></text><g><rect x="60" y="96" width="664" height="54" fill="none" stroke="var(--cds-chart-grid)"></rect></g><g><rect x="355.173" y="96" width="186.74" height="54" fill="var(--cds-chart-muted)" fill-opacity="0.45"><title>hibernation breaks even after about 60 to 800 s, depending on disk speed and guest writes</title></rect><text x="448.543" y="64" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">break-even for hibernation</text><text x="448.543" y="82" text-anchor="middle" fill="var(--cds-text-primary)">60 to 800 s</text></g><g><line x1="471.202" x2="471.202" y1="96" y2="156" stroke="var(--cds-text-primary)" stroke-width="2"></line><text x="471.202" y="188" text-anchor="middle" fill="var(--cds-text-primary)">300 s: the node daemon&#x27;s threshold</text></g><g><rect x="255.231" y="96" width="36.827" height="54" fill="var(--cds-chart-categorical-1)" fill-opacity="0.3" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text x="275.971" y="64" text-anchor="middle" font-weight="600" fill="var(--cds-chart-categorical-1)">model waits</text><text x="275.971" y="82" text-anchor="middle" fill="var(--cds-text-primary)">15 to 25 s</text></g><text x="70" y="128" font-size="13" font-weight="600" fill="var(--cds-text-primary)">pause</text><text x="714" y="128" text-anchor="end" font-size="13" font-weight="600" fill="var(--cds-text-primary)">hibernate</text><g><line x1="60" x2="724" y1="150" y2="150" stroke="var(--cds-chart-axis)" stroke-width="1.25"></line><g><line x1="60" x2="60" y1="150" y2="155" stroke="var(--cds-chart-axis)"></line><text x="60" y="170" text-anchor="middle" fill="var(--cds-text-secondary)">1 s</text></g><g><line x1="226" x2="226" y1="150" y2="1