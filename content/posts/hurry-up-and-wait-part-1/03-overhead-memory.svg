<svg viewBox="0 56 760 236" role="img" aria-label="Extra seconds per rollout keep extra sandboxes alive: slow wakes from hibernation hold about 26 GiB, pausing about 1 GiB, and tools twice as slow 70 to 260 GiB" font-size="12"><g transform="translate(0 -24)"><g><line x1="452.693" x2="452.693" y1="108" y2="248" stroke="var(--cds-chart-reference)" stroke-width="1.25" stroke-dasharray="4 3"></line><text x="452.693" y="102" text-anchor="middle" fill="var(--cds-text-secondary)">one worker&#x27;s usable memory, 176 GiB</text></g><g><text x="24" y="124" font-weight="600" fill="var(--cds-text-primary)">Waking after model waits (Section 4)</text><text x="24" y="212" font-weight="600" fill="var(--cds-text-primary)">Running tools under gVisor (Section 2)</text></g><g><text x="262" y="146" text-anchor="end" fill="var(--cds-text-secondary)" font-weight="400">hibernating: 14 s</text><rect x="272" y="134" width="26.609" height="16" fill="var(--cds-chart-muted)" fill-opacity="0.7"></rect><text x="306.609" y="146" text-anchor="start" fill="var(--cds-text-primary)">26 GiB</text></g><g><text x="262" y="172" text-anchor="end" fill="var(--cds-text-primary)" font-weight="600">pausing: 0.5 s</text><rect x="272" y="160" width="2" height="16" fill="var(--cds-chart-categorical-1)" fill-opacity="0.9"></rect><text x="280.924" y="172" text-anchor="start" fill="var(--cds-text-primary)">1 GiB</text></g><g><text x="262" y="234" text-anchor="end" fill="var(--cds-text-secondary)" font-weight="400">tools twice as slow: 39 to 144 s</text><rect x="272" y="222" width="72.065" height="16" fill="var(--cds-chart-muted)" fill-opacity="0.7"></rect><rect x="344.065" y="222" width="194.021" height="16" fill="var(--cds-chart-muted)" fill-opacity="0.3"></rect><text x="546.085" y="234" text-anchor="start" fill="var(--cds-text-primary)">70 to 260 GiB</text></g><g><line x1="272" x2="580" y1="256" y2="256" stroke="var(--cds-chart-axis)"></line><g><line x1="272" x2="272" y1="256" y2="260" stroke="var(--cds-chart-axis